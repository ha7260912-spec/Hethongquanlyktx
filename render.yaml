services:
  - type: web
    name: hethongquanlyktx
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m deployment.start
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        sync: false
      - key: DATABASE_BOOTSTRAP
        value: "0"
