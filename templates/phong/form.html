{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm" style="border-radius: 12px;">
            <div class="card-header bg-white border-bottom py-3">
                <h5 class="mb-0 fw-bold">{{ action }} Phòng</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Số Phòng <span class="text-danger">*</span></label>
                        <input type="text" name="SoPhong" class="form-control" 
                               value="{{ p.SoPhong if p else '' }}" {{ 'readonly' if action == 'Sửa' }} required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Loại Phòng</label>
                        <input type="text" name="LoaiPhong" class="form-control" value="{{ p.LoaiPhong if p else '' }}">
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Đơn Giá (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" name="DonGia" class="form-control" value="{{ p.DonGia if p else 500000 }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Số Người Tối Đa <span class="text-danger">*</span></label>
                            <input type="number" name="SoNguoiToiDa" class="form-control" value="{{ p.SoNguoiToiDa if p else 4 }}" required>
                        </div>
                    </div>
                    <div class="text-end mt-4">
                        <a href="{{ url_for('phong.list_p') }}" class="btn btn-light border me-2">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary px-4">Lưu lại</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
