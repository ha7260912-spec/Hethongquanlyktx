{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold mb-1"><i class="fas fa-user-tag text-primary me-2"></i>{{ action }} khách</h3>
        <p class="text-muted mb-0">Nhập thông tin người đến thăm ký túc xá</p>
    </div>
    <a href="{{ url_for('khach.index') }}" class="btn btn-light border">Quay lại</a>
</div>

<div class="form-card">
    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Số CMT/CCCD</label>
                <input type="text" name="SoCMT" class="form-control" maxlength="15"
                       value="{{ khach.get('SoCMT', '') }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Họ tên khách</label>
                <input type="text" name="Ten" class="form-control" maxlength="100"
                       value="{{ khach.get('Ten', '') }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Ngày sinh</label>
                <input type="date" name="NgaySinh" class="form-control"
                       value="{{ khach.get('NgaySinh', '').strftime('%Y-%m-%d') if khach.get('NgaySinh') and khach.get('NgaySinh').strftime is defined else khach.get('NgaySinh', '') }}">
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Lưu</button>
            <a href="{{ url_for('khach.index') }}" class="btn btn-secondary ms-2">Hủy</a>
        </div>
    </form>
</div>

{% endblock %}
