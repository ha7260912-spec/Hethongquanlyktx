{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold mb-1"><i class="fas fa-user-friends text-primary me-2"></i>{{ action }} lượt thăm</h3>
        <p class="text-muted mb-0">Ghi nhận khách đến thăm sinh viên</p>
    </div>
    <a href="{{ url_for('tham.index') }}" class="btn btn-light border">Quay lại</a>
</div>

<div class="card card-custom p-4">
    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Khách</label>
                <select name="MaKhach" class="form-select" required>
                    <option value="">-- Chọn khách --</option>
                    {% for k in khach_list %}
                    <option value="{{ k.MaKhach }}" {% if k.MaKhach|string == tham.get('MaKhach', '')|string %}selected{% endif %}>
                        {{ k.Ten }} - {{ k.SoCMT }}
                    </option>
                    {% endfor %}
                </select>
                {% if not khach_list %}<div class="form-text text-danger">Cần thêm khách trước.</div>{% endif %}
            </div>
            <div class="col-md-6">
                <label class="form-label">Sinh viên được thăm</label>
                <select name="MaSV" class="form-select" required>
                    <option value="">-- Chọn sinh viên --</option>
                    {% for sv in sinh_vien %}
                    <option value="{{ sv.MaSV }}" {% if sv.MaSV|string == tham.get('MaSV', '')|string %}selected{% endif %}>
                        {{ sv.MaSV }} - {{ sv.HoTen }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Ngày đến chơi</label>
                <input type="date" name="NgayDenChoi" class="form-control"
                       value="{{ tham.get('NgayDenChoi', '').strftime('%Y-%m-%d') if tham.get('NgayDenChoi') and tham.get('NgayDenChoi').strftime is defined else tham.get('NgayDenChoi', '') }}" required>
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Lưu</button>
            <a href="{{ url_for('tham.index') }}" class="btn btn-secondary ms-2">Hủy</a>
        </div>
    </form>
</div>

{% endblock %}
