{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold mb-1"><i class="fas fa-motorcycle text-primary me-2"></i>{{ action }} xe</h3>
        <p class="text-muted mb-0">Quản lý xe đăng ký của sinh viên</p>
    </div>
    <a href="{{ url_for('xe.index') }}" class="btn btn-light border">Quay lại</a>
</div>

<div class="card card-custom p-4">
    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Biển số xe</label>
                <input type="text" name="BienSo" class="form-control" maxlength="15"
                       value="{{ xe.get('BienSo', '') }}" {% if action == 'Sửa' %}readonly{% endif %} required>
                {% if action == 'Sửa' %}<div class="form-text">Biển số không đổi để bảo toàn lịch sử gửi xe.</div>{% endif %}
            </div>
            <div class="col-md-6">
                <label class="form-label">Sinh viên sở hữu</label>
                <select name="MaSV" class="form-select" required>
                    <option value="">-- Chọn sinh viên --</option>
                    {% for sv in sinh_vien %}
                    <option value="{{ sv.MaSV }}" {% if sv.MaSV|string == xe.get('MaSV', '')|string %}selected{% endif %}>
                        {{ sv.MaSV }} - {{ sv.HoTen }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Loại xe</label>
                <input type="text" name="LoaiXe" class="form-control" maxlength="30"
                       placeholder="Xe máy, xe đạp..." value="{{ xe.get('LoaiXe', '') or '' }}">
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Lưu</button>
            <a href="{{ url_for('xe.index') }}" class="btn btn-secondary ms-2">Hủy</a>
        </div>
    </form>
</div>

{% endblock %}
