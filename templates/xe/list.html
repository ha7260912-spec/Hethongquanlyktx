{% extends "base.html" %}
{% block content %}

<div class="module-hero d-flex justify-content-between align-items-end gap-4">
    <div>
        <h3 class="fw-bold mb-1"><i class="fas fa-motorcycle text-primary me-2"></i>Quản lý Xe</h3>
        <p class="text-muted mb-0">Quản lý xe đăng ký của sinh viên</p>
    </div>
    <a href="{{ url_for('xe.them') }}" class="btn btn-primary">
        <i class="fas fa-plus me-2"></i>Thêm xe
    </a>
</div>

<div class="card card-custom p-4">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>Biển số</th>
                    <th>Sinh viên</th>
                    <th>Loại xe</th>
                    <th class="text-end">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                {% for r in danh_sach %}
                <tr>
                    <td><span class="badge bg-light text-dark border fs-6">{{ r.BienSo }}</span></td>
                    <td><strong>{{ r.HoTen }}</strong><div class="text-muted small">{{ r.MaSV }}</div></td>
                    <td>{{ r.LoaiXe or '—' }}</td>
                    <td class="text-end">
                        <a href="{{ url_for('xe.sua', bien_so=r.BienSo) }}" class="btn btn-sm btn-outline-primary" title="Sửa"><i class="fas fa-pen"></i></a>
                        <form method="POST" class="d-inline" action="{{ url_for('xe.xoa', bien_so=r.BienSo) }}" onsubmit="return confirm('Xóa xe này?')">
                            <button class="btn btn-sm btn-outline-danger" title="Xóa"><i class="fas fa-trash"></i></button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="text-center text-muted py-4">Chưa có xe nào.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
