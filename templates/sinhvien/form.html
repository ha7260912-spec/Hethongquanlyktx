{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-dark mb-4">
            <div class="card-header bg-white border-bottom border-dark py-3">
                <h5 class="mb-0 fw-bold text-uppercase">{{ action }} Hồ sơ Sinh viên</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Mã Sinh Viên <span class="text-danger">*</span></label>
                            <input type="text" name="MaSV" class="form-control" value="{{ sv.MaSV if sv else '' }}" {{ 'readonly' if action == 'Sửa' }} required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Số CMT / CCCD <span class="text-danger">*</span></label>
                            <input type="text" name="SoCMT" class="form-control" value="{{ sv.SoCMT if sv else '' }}" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Họ và Tên <span class="text-danger">*</span></label>
                        <input type="text" name="HoTen" class="form-control" value="{{ sv.HoTen if sv else '' }}" required>
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Ngày sinh</label>
                            <input type="date" name="NgaySinh" class="form-control" value="{{ sv.NgaySinh if sv and sv.NgaySinh else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Lớp</label>
                            <input type="text" name="Lop" class="form-control" value="{{ sv.Lop if sv else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Quê quán</label>
                            <input type="text" name="QueQuan" class="form-control" value="{{ sv.QueQuan if sv else '' }}">
                        </div>
                    </div>
                    
                    <div class="border-top pt-3 text-end">
                        <a href="{{ url_for('sinhvien.list_sv') }}" class="btn btn-secondary me-2">Quay lại</a>
                        <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-1"></i> Lưu hồ sơ</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
