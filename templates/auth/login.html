{% extends "base.html" %}
{% block container_class %}container-fluid p-0{% endblock %}
{% block content %}
<style>
    /* Nền ảnh ký túc xá tràn viền */
    .login-wrapper {
        background: url('https://images.unsplash.com/photo-1555854877-bab0e564b8d5?q=80&w=2069&auto=format&fit=crop') center/cover no-repeat;
        position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    /* Lớp phủ tối để nổi bật form */
    .login-wrapper::before {
        content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65);
    }
    /* Hộp đăng nhập */
    .login-box {
        position: relative; z-index: 1; background: white; padding: 40px; border-radius: 12px;
        width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    /* Tiêu đề lớn */
    .login-title {
        text-align: center; font-size: 2.5rem; font-weight: 900; color: white; position: absolute;
        top: 12%; width: 100%; z-index: 1; text-transform: uppercase; text-shadow: 0 4px 10px rgba(0,0,0,0.8);
        letter-spacing: 2px;
    }
    /* Nút đăng nhập đỏ */
    .btn-red { background-color: #e74c3c; color: white; font-weight: bold; border: none; transition: 0.3s; }
    .btn-red:hover { background-color: #c0392b; color: white; transform: translateY(-2px); }
    
    /* Ô input */
    .input-group-text { background-color: white; border-right: none; }
    .form-control { border-left: none; }
    .form-control:focus { box-shadow: none; border-color: #ced4da; }
</style>

<h1 class="login-title d-none d-md-block">KÝ TÚC XÁ SINH VIÊN</h1>

<div class="login-wrapper">
    <div class="login-box">
        <div class="text-center mb-4 d-md-none">
            <h3 class="fw-bold text-uppercase" style="color: #007bb5;">KÝ TÚC XÁ</h3>
        </div>
        
        <form method="post">
            <div class="mb-3">
                <label class="form-label fw-bold text-muted small">TÊN ĐĂNG NHẬP</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Nhập tài khoản..." required autofocus>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold text-muted small">MẬT KHẨU</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required>
                </div>
            </div>
            
            <div class="d-flex justify-content-end mb-4">
                <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none small fw-bold text-primary">Quên mật khẩu?</a>
            </div>
            
            <button type="submit" class="btn btn-red w-100 py-3 fs-5 rounded-3">Đăng nhập</button>
        </form>
        
        <!-- ĐÃ XÓA DEMO VÀ THÊM NÚT ĐĂNG KÝ -->
        <hr class="my-4 text-muted">
        <div class="text-center">
            <span class="text-muted">Chưa có tài khoản sinh viên?</span> <br>
            <a href="{{ url_for('auth.sinhvien_register') }}" class="text-decoration-none fw-bold fs-5 text-primary mt-2 d-inline-block">
                <i class="fas fa-user-plus me-1"></i> Đăng ký ngay
            </a>
        </div>
    </div>
</div>
{% endblock %}
