{% extends "base.html" %}
{% block content %}
<style>
    body { background: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%); height: 100vh; }
    .forgot-card { 
        background: white; border-radius: 24px; border: none;
        box-shadow: 0 20px 40px rgba(0,0,0,0.08); 
        max-width: 450px; margin: 0 auto; margin-top: 10vh;
    }
    .input-group-custom {
        background: #f8fafc; border: 2px solid #e2e8f0;
        border-radius: 14px; transition: all 0.3s ease; overflow: hidden;
    }
    .input-group-custom:focus-within { border-color: #6366f1; background: #ffffff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
    .input-group-text-custom { background: transparent; border: none; color: #94a3b8; padding-left: 15px; }
    .form-control-custom { background: transparent; border: none; padding: 15px; font-weight: 500; }
    .form-control-custom:focus { box-shadow: none; background: transparent; }
    .btn-reset {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        border: none; border-radius: 14px; padding: 15px;
        font-weight: 700; font-size: 1.1rem; color: white; transition: all 0.3s ease;
    }
    .btn-reset:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4); }
</style>

<div class="container">
    <div class="card forgot-card animate__animated animate__fadeInDown">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="bg-warning bg-opacity-10 text-warning rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
                    <i class="fas fa-key fa-2x"></i>
                </div>
                <h3 class="fw-bold">Quên Mật Khẩu?</h3>
                <p class="text-muted">Nhập tên đăng nhập của bạn. Hệ thống sẽ tự động khôi phục mật khẩu về mặc định.</p>
            </div>

            <form method="post">
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold small">TÊN ĐĂNG NHẬP</label>
                    <div class="input-group input-group-custom">
                        <span class="input-group-text input-group-text-custom"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" class="form-control form-control-custom" required autofocus placeholder="Nhập tài khoản của bạn...">
                    </div>
                </div>

                <button type="submit" class="btn btn-reset w-100 mb-3">
                    <i class="fas fa-sync-alt me-2"></i> Khôi phục mật khẩu
                </button>
                
                <div class="text-center">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-bold text-muted">
                        <i class="fas fa-arrow-left me-1"></i> Quay lại đăng nhập
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
